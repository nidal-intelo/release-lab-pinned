# hotfix-pinned — the per-env-versioning dance, as one button.
#
# THE SCENARIO: a bug lives in what production runs. But uat and production
# sit on DIFFERENT version lines (uat pins qb==1.6.0, production pins
# qb==1.3.2). Fix-forward on dev is not enough — dev is on 1.6.x and the fix
# must reach BOTH deployed lines without dragging along the versions between.
#
# THE COST THIS EXPOSES: the fix must be minted once PER VERSION LINE, PER
# PACKAGE. Give it a one-line fix that spans two packages and two drifted
# environments and you owe up to four release branches and four wheels for a
# single logical change. The tax multiplies with package count — that is the
# price of per-env pinned versioning. (Contrast the source world, where the
# same fix is a SINGLE cherry-pick that rides uat->production as one commit,
# no matter how many packages it touches.)
#
# WHAT THIS BUTTON DOES, given only a PR number:
#   0. resolve the PR to its merge commit (must be MERGED); AUTO-DETECT which
#      shared packages under common/ that commit changed — hotfix each of them
#   for EACH detected package P, on EACH env line (uat's pin, production's pin):
#     1. archaeology — which commit did P's wheel on that line come from?
#        (a manifest.json lookup, not git-log spelunking)
#     2. cut release/<P>-<thatversion> from that commit
#     3. cherry-pick the fix (-x; -m 1 when it's a merge commit). The commit
#        may also carry OTHER packages' changes — harmless: we only build P's
#        wheel from common/P/, the rest just sits in the tree unbuilt.
#     4. bump P to the next FREE patch on that line (registry is immutable, so
#        scan upward past burned numbers)
#     5. build + publish P's wheel, with a manifest entry
#   6. open ONE re-pin PR per env that bumps the pins of ALL hotfixed packages
#      for that env (production PR title prefixed "[merge after uat] ").
#
# SAME-LINE COLLAPSE: if uat and production pin the SAME version of a package
# (e.g. both solver==2.0.0), that package is minted ONCE and both envs re-pin
# to the one new patch — the tax only doubles for packages that have drifted.
#
# ORDERING IS BY CONVENTION, NOT ENFORCEMENT. The pinned world has no gate
# workflow and no branch protection (that is a source-world feature; adding
# it here would muddy the comparison). Uat-first is signalled two ways: the
# production PR's title prefix, and the step summary. A human keeps the order.
#
# Inputs:
#   pr  — the dev PR number carrying the fix (resolved to its merge commit;
#         must be merged). Packages to hotfix are detected from its diff.
#
# The versions to patch are AUTO-DETECTED from what uat and production pin
# right now — no version to type, no way to fat-finger the wrong line.
#
# Real-world category: release-branch automation / hotfix pipelines backed by
# build provenance (SLSA-style "which commit built this artifact"). PR
# credential prefers secrets.LAB_BOT_PAT (same teachable as repin.yaml: a
# GITHUB_TOKEN-created PR triggers no pull_request checks).

name: hotfix-pinned

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "dev PR number carrying the fix (packages auto-detected from its diff)"
        type: string
        required: true

permissions:
  contents: write            # release branches + registry commit + repin branches
  pull-requests: write       # the per-env re-pin PRs

# Writes the registry branch — share publish.yaml's lock so they never race.
concurrency:
  group: registry-branch
  cancel-in-progress: false

jobs:
  hotfix:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.LAB_BOT_PAT || github.token }}
    steps:
      # Full history + every branch: a line's source commit may sit deep in
      # dev history or on a previous release/* branch (a hotfix of a hotfix).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.LAB_BOT_PAT || github.token }}
      - run: git fetch -q origin '+refs/heads/*:refs/remotes/origin/*'

      - uses: actions/checkout@v4
        with:
          ref: registry
          path: .registry-branch

      - uses: astral-sh/setup-uv@v5

      - name: hotfix every changed package across both env lines
        shell: bash
        run: |
          set -euo pipefail
          PR="${{ inputs.pr }}"
          REG="$GITHUB_WORKSPACE/.registry-branch"
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          SUMMARY="$GITHUB_STEP_SUMMARY"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # ---- resolve the PR to its merge commit (must be merged) ---------
          STATE="$(gh pr view "$PR" --json state --jq .state 2>/dev/null || echo MISSING)"
          [ "$STATE" = MERGED ] || { echo "::error::PR #$PR is not merged (state: $STATE) — the fix must be landed first"; exit 1; }
          FIX="$(gh pr view "$PR" --json mergeCommit --jq '.mergeCommit.oid')"
          [ -n "$FIX" ] && [ "$FIX" != null ] || { echo "::error::PR #$PR has no merge commit"; exit 1; }
          git cat-file -e "$FIX" || { echo "::error::merge commit $FIX not found in history"; exit 1; }

          # ---- DETECT which shared packages the fix changed ----------------
          # From the merge commit's own diff (parent^1 = the base-branch side,
          # matching the -m 1 replay). Map common/<pkg>/** -> <pkg>.
          CHANGED="$(git diff --name-only "$FIX^1" "$FIX" || true)"
          mapfile -t PKGS < <(grep -oE '^common/[^/]+/' <<<"$CHANGED" | sed 's#^common/##; s#/##' | sort -u)
          if [ "${#PKGS[@]}" -eq 0 ]; then
            echo "::error::PR #$PR touches no shared package under common/ — nothing to hotfix via this lane (a service-own-code fix just redeploys the service)."
            exit 1
          fi
          echo "PR #$PR -> merge commit ${FIX:0:7}; changed packages: ${PKGS[*]}"

          # what does <env> pin for <pkg> right now?
          detect_pin() { # <env-branch> <pkg>
            git show "origin/$1:consumers/report/pyproject.toml" \
              | sed -n "s/.*\"$2==\([0-9][0-9.]*\)\".*/\1/p" | head -1
          }
          # next FREE patch at/above a base (immutable registry: never reuse a
          # burned number — scans past e.g. the auto-bump wheel that landed
          # when the fix merged to dev).
          next_free() { # <pkg> <base>
            local pkg="$1" mm="${2%.*}" p="${2##*.}"
            while [ -e "$REG/$pkg-$mm.$p-py3-none-any.whl" ]; do p=$((p+1)); done
            echo "$mm.$p"
          }
          # -m 1 for merge commits (git rejects -m on ordinary commits).
          pick_fix() {
            if [ "$(git rev-list --parents -n1 "$FIX" | wc -w)" -gt 2 ]; then
              git cherry-pick -x -m 1 "$FIX"
            else
              git cherry-pick -x "$FIX"
            fi
          }

          declare -A ENV_BASE   # "pkg|env"  -> version that env pins for pkg
          declare -A ENV_NEW    # "pkg|env"  -> new patch that env will re-pin to
          declare -A LINE_NEW   # "pkg|base" -> new patch (same-line collapse)
          declare -A PKG_LINES  # "pkg"      -> count of distinct lines minted
          NEWWHEELS=()
          RESULT_NEW=""

          {
            echo "## hotfix from PR #$PR (\`${FIX:0:7}\`)"
            echo ""
            echo "changed packages: **${PKGS[*]}**"
            echo ""
          } >> "$SUMMARY"

          # ---- process one (package, base-version) line: steps 1-5 ----------
          process_line() { # <pkg> <base>  ; sets RESULT_NEW
            local PKG="$1" BASE="$2"
            local WHEEL="$PKG-$BASE-py3-none-any.whl"
            [ -e "$REG/$WHEEL" ] || { echo "::error::$WHEEL not in registry — cannot hotfix the $PKG $BASE line"; exit 1; }
            local SRC; SRC="$(jq -r --arg w "$WHEEL" '.[$w].source_commit_sha // "missing"' "$REG/manifest.json")"
            if [ "$SRC" = missing ] || [ "$SRC" = unknown ]; then
              echo "::error::manifest has no usable source commit for $WHEEL (got $SRC)"; exit 1
            fi
            git cat-file -e "$SRC" || { echo "::error::manifest points at $SRC for $WHEEL but that commit is absent"; exit 1; }

            local NEW; NEW="$(next_free "$PKG" "$BASE")"
            local RELBRANCH="release/$PKG-$BASE"
            if git ls-remote --exit-code -q origin "refs/heads/$RELBRANCH" >/dev/null; then
              echo "::error::$RELBRANCH already exists on origin — the $PKG $BASE line was hotfixed before. Delete it or rerun after its patch is pinned."
              exit 1
            fi
            git checkout -q -B "$RELBRANCH" "$SRC"

            # the fix may span multiple packages; applying the whole commit is
            # fine — we build only THIS package below.
            pick_fix

            sed -i "s/^version = \"$BASE\"/version = \"$NEW\"/" "common/$PKG/pyproject.toml"
            grep -q "version = \"$NEW\"" "common/$PKG/pyproject.toml" \
              || { echo "::error::bump failed — is $BASE really $PKG's version at ${SRC:0:7}?"; exit 1; }
            git commit -qam "hotfix: $PKG $NEW (cherry-pick ${FIX:0:7} onto $BASE)"
            git push -q origin "HEAD:$RELBRANCH"

            local NEWWHEEL="$PKG-$NEW-py3-none-any.whl"
            uv build -q --wheel "common/$PKG" -o "$RUNNER_TEMP/hotfix-dist"
            cp "$RUNNER_TEMP/hotfix-dist/$NEWWHEEL" "$REG/"
            [ -e "$REG/$NEWWHEEL" ] || { echo "::error::build produced no $NEWWHEEL"; exit 1; }
            local HSHA; HSHA="$(git rev-parse HEAD)"
            jq --arg w "$NEWWHEEL" --arg p "$PKG" --arg v "$NEW" --arg sha "$HSHA" --arg url "$RUN_URL" \
               '.[$w] = {package:$p, version:$v, source_commit_sha:$sha, dev_run_url:$url}' \
               "$REG/manifest.json" > "$REG/manifest.json.tmp" && mv "$REG/manifest.json.tmp" "$REG/manifest.json"
            NEWWHEELS+=("$NEWWHEEL")
            echo "- \`$RELBRANCH\` cut from \`${SRC:0:7}\`, fix picked, **$PKG $BASE -> $NEW**, published \`$NEWWHEEL\`" >> "$SUMMARY"
            RESULT_NEW="$NEW"
          }

          # ---- for each package, each env line (with same-line collapse) ----
          for PKG in "${PKGS[@]}"; do
            if [ ! -d "common/$PKG" ]; then
              echo "- :warning: \`common/$PKG\` is not a package dir — skipping" >> "$SUMMARY"; continue
            fi
            PKG_LINES["$PKG"]=0
            for ENVB in uat production; do
              BASE="$(detect_pin "$ENVB" "$PKG")"
              if [ -z "$BASE" ]; then
                echo "- :warning: \`$ENVB\` does not pin \`$PKG\` — skipping that line" >> "$SUMMARY"; continue
              fi
              ENV_BASE["$PKG|$ENVB"]="$BASE"
              KEY="$PKG|$BASE"
              if [ -z "${LINE_NEW[$KEY]:-}" ]; then
                process_line "$PKG" "$BASE"
                LINE_NEW["$KEY"]="$RESULT_NEW"
                PKG_LINES["$PKG"]=$(( ${PKG_LINES["$PKG"]} + 1 ))
              fi
              ENV_NEW["$PKG|$ENVB"]="${LINE_NEW[$KEY]}"
            done
          done

          # ---- publish ALL new wheels in ONE immutable registry commit ------
          git -C "$REG" add -A
          git -C "$REG" -c user.name="github-actions[bot]" \
                        -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                        commit -q -m "publish: ${NEWWHEELS[*]} (hotfix from PR #$PR)"
          git -C "$REG" push -q origin HEAD:registry

          # ---- step 6: ONE re-pin PR per env, bumping every hotfixed pkg ----
          PKGCSV="$(IFS=,; echo "${PKGS[*]}")"
          open_repin_pr() { # <env> <title-prefix>
            local ENVB="$1" PREFIX="$2"
            local PINBRANCH="hotfix/repin-$ENVB-$GITHUB_RUN_ID"
            git checkout -q -B "$PINBRANCH" "origin/$ENVB"
            local CHANGED=0
            local BODY="$RUNNER_TEMP/body-$ENVB.md"
            {
              echo "Re-pins hotfixed packages on \`$ENVB\` (fix from PR #$PR, \`${FIX:0:7}\`):"
              echo ""
            } > "$BODY"
            for PKG in "${PKGS[@]}"; do
              local BASE="${ENV_BASE[$PKG|$ENVB]:-}" NEW="${ENV_NEW[$PKG|$ENVB]:-}"
              [ -n "$BASE" ] && [ -n "$NEW" ] || continue
              for CONSUMER in report worker; do
                local TOML="consumers/$CONSUMER/pyproject.toml"
                if grep -q "$PKG==$BASE" "$TOML"; then
                  sed -i "s/$PKG==$BASE/$PKG==$NEW/" "$TOML"; CHANGED=1
                fi
              done
              echo "- \`$PKG==$BASE\` -> \`$PKG==$NEW\`" >> "$BODY"
            done
            if [ "$CHANGED" = 0 ]; then
              echo "- :warning: nothing to re-pin on \`$ENVB\`" >> "$SUMMARY"; return
            fi
            if [ -n "$PREFIX" ]; then
              printf '\n**Ordering:** merge the uat re-pin FIRST, validate, then merge this one. Convention-enforced (no gate here); the title prefix is the reminder.\n' >> "$BODY"
            fi
            printf '\n_Opened by hotfix-pinned.yaml. No checks on this PR? That is the GITHUB_TOKEN teachable — see repin.yaml._\n' >> "$BODY"
            git commit -qam "hotfix: re-pin $ENVB ($PKGCSV)"
            git push -q origin "HEAD:$PINBRANCH"
            gh pr create --base "$ENVB" --head "$PINBRANCH" \
              --title "${PREFIX}hotfix: re-pin $ENVB ($PKGCSV)" --body-file "$BODY"
            echo "- :rocket: re-pin PR opened against \`$ENVB\`" >> "$SUMMARY"
          }

          open_repin_pr uat        ""
          open_repin_pr production "[merge after uat] "

          # ---- tally that scales with package count -------------------------
          NP="${#PKGS[@]}"; NW="${#NEWWHEELS[@]}"
          LINEDESC=""
          for PKG in "${PKGS[@]}"; do
            LINEDESC="$LINEDESC $PKG: ${PKG_LINES[$PKG]:-0} line(s);"
          done
          {
            echo ""
            echo "### the tally"
            echo "**PR #$PR changed {$PKGCSV} -> hotfixed $NP package(s) across the env lines = $NW release branch(es) + $NW wheel(s); 2 re-pin PRs (each bumping the changed pins for its env).**"
            echo ""
            echo "Per package —$LINEDESC a package uat & production already agree on is minted ONCE and shared, so the tax only doubles where the environments drifted apart."
            echo ""
            echo "Merge order: **uat first**, then production — by convention (title prefix + this note); there is no gate here."
            echo ""
            echo "> Contrast: the **source world** ships this exact fix as ONE cherry-pick that rides uat->production as a single commit — one artifact, whatever the package count. Here it is $NW wheel(s) and 2 PRs. That multiplier IS per-env pinned versioning."
          } >> "$SUMMARY"
