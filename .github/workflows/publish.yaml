# publish — mint versions, then build wheels into the registry branch.
#
# Act 1 shipped the bottom job only: a push to dev touching common/** builds
# any wheel whose version isn't in the registry yet. IMMUTABLE: same version
# = no republish. Only a version BUMP produces a new wheel — and remembering
# to bump was a human job.
#
# Act 1.5 adds the `auto-bump` job in front (real-world category:
# semantic-release / release-please — tools that mint the next version from
# the commits that landed, so no human ever "remembers to bump"). If common
# source lands on dev WITHOUT a version change, auto-bump computes the next
# patch version, commits "bot(bump): <pkg> X.Y.Z" back to dev, and the
# publish job builds from that bumped commit.
#
# WHY ONE WORKFLOW, TWO JOBS (and not a separate bump workflow): pushes made
# with the default GITHUB_TOKEN do NOT trigger other workflows (GitHub
# suppresses them to prevent infinite loops). A standalone bump workflow
# would push the bump… and publish would never fire. Living in the same
# workflow sidesteps that: the publish job simply checks out the bumped SHA
# that auto-bump just pushed. (The same suppression rule is the star of the
# repin workflow's teachable — see repin.yaml.)

name: publish

on:
  push:
    branches: [dev]          # publishing happens from dev only
    paths: ["common/**"]     # ...and only when shared-package source changed

permissions:
  contents: write            # bump commits to dev + wheel commits to registry

# The registry branch is a single shared resource: if two publishes ran at
# once, the second push would be rejected (non-fast-forward). Serialize them.
# (hotfix-pinned.yaml uses the SAME group name — it also writes the registry.)
concurrency:
  group: registry-branch
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- auto-bump
  # Decides, per package: does this push contain source changes that are
  # stranded under an already-published version? If yes, mint the next patch.
  auto-bump:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.bump.outputs.sha }}   # dev HEAD after any bump commits
    steps:
      # Full history: we diff against the pre-push SHA to see what landed.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The registry tells us which versions already exist ("published").
      - uses: actions/checkout@v4
        with:
          ref: registry
          path: .registry-branch

      - name: bump any package whose source changed without a version change
        id: bump
        run: |
          # What did this push actually change? Compare against the pre-push
          # SHA GitHub hands us. (All-zero SHA = branch creation; fall back.)
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            BASE="HEAD^"
          fi

          BUMPED=0
          echo "## auto-bump (dev @ $(git rev-parse --short HEAD))" >> "$GITHUB_STEP_SUMMARY"

          for PKG in qb solver; do
            # Nothing under this package changed in this push -> not our beat.
            git diff --quiet "$BASE" HEAD -- "common/$PKG" && continue

            # LOOP GUARD #1: if this push already touched the version line —
            # a human bumped, or this IS a previous bot(bump) commit — the
            # version was minted deliberately. Never second-guess it, never
            # bump on top of a bump.
            if git diff "$BASE" HEAD -- "common/$PKG/pyproject.toml" | grep -q '^+version'; then
              echo "- $PKG: version line changed in this push — a human (or the bot) already minted it. No action." >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            VERSION="$(grep -m1 '^version' "common/$PKG/pyproject.toml" | cut -d'"' -f2)"

            # Version not published yet? Then it's a fresh number and the
            # publish job below will ship it — nothing stranded, no bump.
            if [ ! -e ".registry-branch/$PKG-$VERSION-py3-none-any.whl" ]; then
              echo "- $PKG: $VERSION is not published yet — publish will pick it up as-is." >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            # Source changed + version untouched + version already published
            # = the exact human mistake this job exists to erase. Mint patch+1.
            NEW="${VERSION%.*}.$(( ${VERSION##*.} + 1 ))"
            sed -i "s/^version = \"$VERSION\"/version = \"$NEW\"/" "common/$PKG/pyproject.toml"
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "bot(bump): $PKG $NEW"
            echo "- :robot: **$PKG: source changed under already-published $VERSION — auto-bumped to $NEW**" >> "$GITHUB_STEP_SUMMARY"
            BUMPED=1
          done

          # LOOP GUARD #2 (belt to guard #1's braces): this push uses
          # GITHUB_TOKEN, so it triggers no workflows at all — the bump
          # cannot re-enter this workflow even if guard #1 had a hole.
          if [ "$BUMPED" = 1 ]; then
            git push origin HEAD:dev
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------ publish
  # Unchanged Act-1 logic, except it builds from auto-bump's output SHA (dev
  # HEAD *including* any bump commit just pushed).
  publish:
    needs: auto-bump
    runs-on: ubuntu-latest
    steps:
      # The (possibly bot-bumped) dev tree — source of truth for versions.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.auto-bump.outputs.sha }}

      # The registry, checked out as a plain subdirectory.
      - uses: actions/checkout@v4
        with:
          ref: registry
          path: .registry-branch

      - uses: astral-sh/setup-uv@v5

      - name: build any wheel whose version is not yet published
        run: |
          # Absolute path: uv resolves a relative --out-dir against the
          # package being built, not the workflow's working directory.
          REG="$GITHUB_WORKSPACE/.registry-branch"
          echo "## publish (dev @ $(git rev-parse --short HEAD))" >> "$GITHUB_STEP_SUMMARY"

          for PKG in qb solver; do
            VERSION="$(grep -m1 '^version' "common/$PKG/pyproject.toml" | cut -d'"' -f2)"
            WHEEL="$PKG-$VERSION-py3-none-any.whl"

            # --- the immutability gate ------------------------------------
            if [ -e "$REG/$WHEEL" ]; then
              echo "REFUSED: $PKG $VERSION is already in the registry (immutable)."
              echo "- :no_entry: **$PKG $VERSION already published — no-op. Same version = no republish.** (bump the version in common/$PKG/pyproject.toml to ship new code)" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            # Build into a temp dir and copy the wheel over. (Not straight
            # into the checkout: uv drops a ".gitignore" containing "*" into
            # its out-dir, which would hide the new wheel from git entirely.)
            uv build -q --wheel "common/$PKG" -o "$RUNNER_TEMP/dist-$PKG"
            cp "$RUNNER_TEMP/dist-$PKG/$WHEEL" "$REG/"
            # Trust nothing: the wheel must exist where the commit step looks.
            [ -e "$REG/$WHEEL" ] || { echo "BUILD FAILED: $WHEEL not in registry checkout" >&2; exit 1; }
            echo "published: $WHEEL"
            echo "- :package: **published \`$WHEEL\`** to the registry branch" >> "$GITHUB_STEP_SUMMARY"
            # Remember what we published — the manifest step below records it.
            echo "$PKG $VERSION $WHEEL" >> "$RUNNER_TEMP/published.txt"
          done

      # ---- provenance manifest -------------------------------------------
      # manifest.json (on the registry branch) maps every wheel back to the
      # exact dev commit it was built from, plus the run that built it. This
      # is the "which commit does production actually run?" question answered
      # in advance — the archaeology that a hotfix otherwise starts with
      # (git log spelunking through pyproject history). hotfix-pinned.yaml
      # reads this file instead of a human reading `git log`.
      - name: record provenance in manifest.json
        run: |
          [ -s "$RUNNER_TEMP/published.txt" ] || { echo "nothing published — manifest untouched"; exit 0; }
          cd .registry-branch
          [ -s manifest.json ] || echo '{}' > manifest.json
          SHA="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          while read -r PKG VERSION WHEEL; do
            jq --arg w "$WHEEL" --arg p "$PKG" --arg v "$VERSION" \
               --arg sha "$SHA" --arg url "$RUN_URL" \
               '.[$w] = {package: $p, version: $v, source_commit_sha: $sha, dev_run_url: $url}' \
               manifest.json > manifest.json.tmp && mv manifest.json.tmp manifest.json
            echo "- :scroll: manifest: \`$WHEEL\` <- \`${SHA:0:7}\`" >> "$GITHUB_STEP_SUMMARY"
          done < "$RUNNER_TEMP/published.txt"

      - name: commit new wheels to the registry branch (if any)
        run: |
          cd .registry-branch
          git add -A
          if git diff --cached --quiet; then
            echo "registry unchanged — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "publish: $(git diff --cached --name-only | tr '\n' ' ')"
          git push origin HEAD:registry

      - name: registry contents (after)
        run: |
          {
            echo ""
            echo "### registry now contains"
            echo '```'
            ls .registry-branch/*.whl | xargs -n1 basename
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
