# repin — open ONE batched PR moving consumer pins to the newest wheels.
#
# Act 1's re-pin PRs (exercise 1.1, PR 2 and PR 3 — including the one you
# "forgot") were pure bookkeeping: registry moved, edit `qb==X` in every
# consumer, open PR. This workflow is that bookkeeping, automated.
# Real-world category: Renovate / Dependabot — dependency-update bots that
# watch a registry and open PRs moving pins forward.
#
# Fires after every successful `publish` run (workflow_run), plus manually.
# Behavior mirrors Renovate's:
#   - ONE batched PR (branch bot/repin-consumers), not one per consumer;
#   - if that PR is already open, push another commit onto it instead of
#     stacking a second PR;
#   - PR body = table of pin moves.
#
# ── THE DELIBERATE TEACHABLE ──────────────────────────────────────────────
# This workflow uses the default GITHUB_TOKEN unless you give it better.
# GitHub suppresses events caused by GITHUB_TOKEN: a PR it opens (or a
# branch it pushes) triggers NO pull_request workflows. Concretely: the bot's
# PR will show ZERO checks — pr-resolve-check never runs on it. This is not
# a bug in this file; it is the platform behaving as documented, and it is
# exactly why real-world bot setups (Renovate included) run with a dedicated
# bot identity / PAT instead of the workflow's own token.
#
# THE FIX (an exercise, not a patch): mint a fine-grained PAT scoped to this
# repo with contents:RW + pull-requests:RW, save it as the repo secret
# LAB_BOT_PAT. Every credential below already PREFERS that secret and falls
# back to GITHUB_TOKEN — add the secret and checks start firing on bot PRs
# with no edits to this file.
# ──────────────────────────────────────────────────────────────────────────

name: repin

on:
  workflow_run:
    workflows: [publish]
    types: [completed]
  workflow_dispatch: {}      # manual re-run, e.g. after closing a bot PR

permissions:
  contents: write            # push the bot/repin-consumers branch
  pull-requests: write       # open / edit the batched PR

# One repin at a time: two runs would race the same branch + PR.
concurrency:
  group: repin
  cancel-in-progress: false

jobs:
  repin:
    # workflow_run fires on failure too — only act on a green publish.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      # The credential story in one line: prefer the learner-provided PAT,
      # fall back to the (event-suppressed) default token.
      GH_TOKEN: ${{ secrets.LAB_BOT_PAT || github.token }}
    steps:
      # Explicit ref: on workflow_run the default checkout is not guaranteed
      # to be dev HEAD. Same token as above so pushes fire events iff a PAT
      # is configured.
      - uses: actions/checkout@v4
        with:
          ref: dev
          token: ${{ secrets.LAB_BOT_PAT || github.token }}

      # Newest published version per package = whatever wheels exist here.
      - uses: actions/checkout@v4
        with:
          ref: registry
          path: .registry-branch

      - name: move stale pins, open or update the batched PR
        run: |
          REG="$GITHUB_WORKSPACE/.registry-branch"
          BRANCH="bot/repin-consumers"

          # Newest published version of a package, straight from the wheel
          # filenames (sort -V = version-aware sort).
          newest() {
            ls "$REG/$1"-*.whl 2>/dev/null | xargs -rn1 basename \
              | sed -E "s/^$1-(.+)-py3-none-any\.whl$/\1/" | sort -V | tail -1
          }

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Renovate-style "update, don't stack": if our PR is already open,
          # build on ITS branch; otherwise start fresh from dev HEAD.
          OPEN_PR="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number' || true)"
          if [ -n "$OPEN_PR" ]; then
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            echo "existing open bot PR #$OPEN_PR — updating its branch"
          else
            git checkout -B "$BRANCH"
            # A bot PR closed WITHOUT merging can leave its old branch behind;
            # our fresh history would not fast-forward onto it. The branch is
            # ephemeral bot property — clear any leftover before pushing.
            git push origin ":$BRANCH" 2>/dev/null || true
          fi

          # Compare every consumer pin against the newest published version.
          TABLE="| consumer | package | pinned | newest |
          |---|---|---|---|"
          MOVED=0
          for CONSUMER in report worker; do
            TOML="consumers/$CONSUMER/pyproject.toml"
            for PKG in qb solver; do
              PIN="$(grep -oE "$PKG==[0-9.]+" "$TOML" | head -1 | cut -d= -f3 || true)"
              [ -n "$PIN" ] || continue            # consumer doesn't use PKG
              NEW="$(newest "$PKG")"
              [ -n "$NEW" ] || continue            # nothing published (?)
              # "behind" = differs AND sorts before the newest.
              if [ "$PIN" != "$NEW" ] && \
                 [ "$(printf '%s\n%s\n' "$PIN" "$NEW" | sort -V | head -1)" = "$PIN" ]; then
                sed -i "s/$PKG==$PIN/$PKG==$NEW/" "$TOML"
                TABLE="$TABLE
          | $CONSUMER | $PKG | \`$PKG==$PIN\` | \`$PKG==$NEW\` |"
                MOVED=1
              fi
            done
          done

          if [ "$MOVED" = 0 ]; then
            echo "## repin: nothing to do" >> "$GITHUB_STEP_SUMMARY"
            echo "Every consumer pin already matches the newest published wheel." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          BODY="$(printf '%s\n' "Pins moved to the newest published wheels:" "" "$TABLE" "" \
            "_Opened by repin.yaml (Renovate category). If this PR shows no checks, that is the GITHUB_TOKEN teachable — see the workflow header._")"

          git commit -am "bot(repin): consumer pins -> newest published wheels"
          git push origin "HEAD:$BRANCH"

          if [ -n "$OPEN_PR" ]; then
            gh pr edit "$OPEN_PR" --body "$BODY"
            echo "## repin: updated open PR #$OPEN_PR" >> "$GITHUB_STEP_SUMMARY"
          else
            gh pr create --base dev --head "$BRANCH" \
              --title "bot(repin): consumer pins -> newest published wheels" \
              --body "$BODY"
            echo "## repin: opened a new PR" >> "$GITHUB_STEP_SUMMARY"
          fi
          printf '%s\n' "" "$BODY" >> "$GITHUB_STEP_SUMMARY"
